name: Update data and retrain model

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update open data sources
        run: python update_open_sources.py

      - name: Train candidate and compare with current model
        run: python train.py --download

      - name: Fill completed results in prediction journal
        run: python update_journal.py

      - name: Re-run World Cup backtests
        run: python backtest_world_cups.py

      - name: Commit updated data and accepted model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"

          git add \
            data/results.csv \
            data/fifa_rankings_history.csv \
            data/fifa_rankings_current.csv \
            data/world_cup_2026_fixtures.csv \
            data/enriched_match_stats.csv \
            data/match_lineups.csv \
            data/player_pool.csv \
            data/prediction_log.csv \
            models/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automatic open-data update and model evaluation"
            git push
          fi
